<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>越秀集团 - 跨境财富管理产品库</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&display=swap');

        :root {
            --navy: #123243;
            --deep: #091f2b;
            --orange: #d45b25;
            --gold: #b8914b;
            --ivory: #f7f3e9;
            --muted: #66777e;
            --line: #ded9cc;
            --bg-card: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            color: #233942;
            background: var(--ivory);
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button, input, select {
            font: inherit;
            outline: none;
        }

        button, a {
            color: inherit;
            transition: all 0.2s ease;
        }

        header {
            height: 76px;
            padding: 0 clamp(22px, 6vw, 90px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(247, 243, 233, 0.94);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 30;
            backdrop-filter: blur(15px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand i {
            width: 5px;
            height: 42px;
            border-radius: 8px;
            background: var(--orange);
            box-shadow: 8px 0 #edc4ac;
        }

        .brand.inverse i {
            box-shadow: 8px 0 rgba(212, 91, 37, 0.2);
        }

        .brand div {
            display: flex;
            flex-direction: column;
        }

        .brand strong {
            font-family: serif;
            font-size: 18px;
            letter-spacing: 0.16em;
            color: var(--navy);
        }

        .brand.inverse strong {
            color: white;
        }

        .brand small {
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 0.08em;
        }

        nav {
            display: flex;
            gap: 30px;
            font-size: 13px;
            font-weight: 700;
        }

        nav a {
            text-decoration: none;
        }
        
        nav a:hover {
            color: var(--orange);
        }

        .hero {
            min-height: 570px;
            padding: 80px clamp(24px, 8vw, 120px);
            display: grid;
            grid-template-columns: 1.4fr 0.6fr;
            align-items: center;
            gap: 70px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #f9f6ed 55%, #dce9e8);
        }

        .hero:after {
            content: "";
            position: absolute;
            left: -5%;
            right: -5%;
            bottom: -80px;
            height: 210px;
            border-radius: 50% 55% 0 0;
            background: linear-gradient(12deg, #17394a 45%, #37636d 46%, #85a6a1 60%, transparent 61%);
            opacity: 0.82;
            pointer-events: none;
        }

        .hero-copy, .hero-card {
            position: relative;
            z-index: 1;
        }

        .eyebrow {
            margin: 0 0 14px;
            color: var(--orange);
            font-size: 11px;
            letter-spacing: 0.2em;
            font-weight: 800;
            text-transform: uppercase;
        }

        .hero h1 {
            margin: 0;
            color: var(--navy);
            font: 700 clamp(45px, 6vw, 76px)/1.16 serif;
            letter-spacing: 0.04em;
        }

        .hero h1 em {
            color: var(--orange);
            font-style: normal;
        }

        .hero-copy > p:not(.eyebrow) {
            max-width: 650px;
            margin: 25px 0 0;
            color: #5a6d72;
            font-size: 17px;
            line-height: 1.9;
        }

        .actions {
            display: flex;
            gap: 14px;
            margin-top: 36px;
        }

        .actions a {
            padding: 14px 22px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 800;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .actions a.primary {
            color: white;
            background: var(--orange);
        }
        
        .actions a.primary:hover {
            background: #b84b1a;
        }

        .actions a.secondary {
            border: 1px solid #879a9c;
            background: #faf7ef;
        }
        
        .actions a.secondary:hover {
            background: white;
            border-color: var(--navy);
        }

        .hero-card {
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.68);
            box-shadow: 0 22px 60px rgba(22, 52, 64, 0.13);
            backdrop-filter: blur(12px);
        }

        .hero-card > span {
            font-size: 11px;
            color: var(--muted);
        }

        .hero-card > b {
            display: block;
            margin: 5px 0 22px;
            color: var(--navy);
            font-size: 19px;
        }

        .hero-card > div {
            display: flex;
            align-items: baseline;
            gap: 13px;
            padding: 15px 0;
            border-top: 1px solid var(--line);
        }

        .hero-card strong {
            color: var(--orange);
            font-size: 31px;
            font-weight: 800;
        }

        .hero-card small {
            color: var(--muted);
            font-size: 12px;
            font-weight: 500;
        }

        .journeys {
            padding: 38px clamp(24px, 6vw, 90px);
            background: var(--navy);
            color: white;
        }

        .journeys > p {
            margin: 0 0 18px;
            color: #abc0c7;
            font-size: 12px;
        }

        .journeys > div {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1px;
            background: #496675;
            border-radius: 4px;
            overflow: hidden;
        }

        .journeys button {
            min-height: 88px;
            padding: 15px 20px;
            text-align: left;
            color: white;
            border: 0;
            background: var(--navy);
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.4;
        }

        .journeys button:hover {
            background: #1b4557;
        }

        .journeys span {
            display: block;
            font-size: 11px;
            color: #85a6a1;
            margin-bottom: 8px;
            font-family: Monaco, monospace;
            letter-spacing: 0.1em;
        }

        .catalog {
            padding: 70px clamp(24px, 6vw, 90px);
        }

        .catalog .title {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .catalog .title h2 {
            margin: 0;
            font-size: 32px;
            color: var(--navy);
        }

        #count {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
        }

        #count b {
            color: var(--orange);
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            flex-wrap: wrap;
            align-items: center;
        }

        .filters label, .filters select, .filters input[type="text"] {
            font-size: 13px;
            color: var(--navy);
        }
        
        .filters .search {
            display: flex;
            align-items: center;
            background: var(--ivory);
            padding: 0 12px;
            border-radius: 4px;
            flex-grow: 1;
            min-width: 250px;
            border: 1px solid transparent;
        }

        .filters .search:focus-within {
            border-color: var(--line);
        }

        .filters .search span {
            font-size: 16px;
            color: var(--muted);
            margin-right: 8px;
        }

        .filters input[type="text"] {
            border: 0;
            background: transparent;
            padding: 10px 0;
            width: 100%;
        }
        
        .filters input[type="text"]::placeholder {
            color: #a0b2b8;
        }

        .filters select {
            padding: 10px 14px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }

        .filters .toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 0 10px;
            font-weight: 500;
        }
        
        .filters input[type="checkbox"] {
            accent-color: var(--orange);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .product {
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.06);
            border-color: transparent;
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tags span, .tags b {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            background: var(--ivory);
            color: var(--navy);
            font-weight: 500;
        }

        .tags b {
            background: rgba(212, 91, 37, 0.1);
            color: var(--orange);
        }

        .product small {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 8px;
            display: block;
        }

        .product h3 {
            margin: 0 0 12px;
            font-size: 18px;
            color: var(--navy);
            line-height: 1.4;
        }

        .product p {
            margin: 0 0 20px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
            flex-grow: 1;
        }

        .aud {
            background: #fcfcfc;
            border: 1px dashed var(--line);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .aud b {
            display: block;
            margin-bottom: 4px;
            color: var(--navy);
        }

        .aud span {
            color: #5a6d72;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product button {
            background: transparent;
            border: 1px solid var(--line);
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            color: var(--navy);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product button:hover {
            background: var(--navy);
            color: white;
            border-color: var(--navy);
        }
        
        .product button span {
            color: var(--orange);
            font-size: 16px;
            pointer-events: none; /* Make sure clicking span registers on button */
        }

        .empty {
            grid-column: 1 / -1;
            padding: 80px 20px;
            text-align: center;
            color: var(--muted);
            background: white;
            border-radius: 8px;
            border: 1px dashed var(--line);
        }

        .more {
            display: block;
            margin: 40px auto 0;
            padding: 12px 30px;
            background: transparent;
            border: 1px solid var(--muted);
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            color: var(--navy);
            font-weight: 600;
        }
        
        .more:hover {
            background: var(--line);
        }

        .path {
            padding: 80px clamp(24px, 6vw, 90px);
            background: white;
        }

        .path h2 {
            margin: 0 0 40px;
            font-size: 32px;
            color: var(--navy);
        }

        .path > div {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .path article {
            background: var(--ivory);
            padding: 30px 25px;
            border-radius: 8px;
            position: relative;
        }

        .path article span {
            font-family: serif;
            font-size: 48px;
            font-weight: 800;
            color: var(--line);
            line-height: 1;
            display: block;
            margin-bottom: 20px;
        }

        .path article b {
            display: block;
            font-size: 17px;
            color: var(--navy);
            margin-bottom: 8px;
        }

        .path article small {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            display: block;
        }

        footer {
            background: var(--deep);
            color: #879a9c;
            padding: 60px clamp(24px, 6vw, 90px);
            display: flex;
            justify-content: space-between;
            gap: 60px;
            flex-wrap: wrap;
        }

        footer b {
            display: block;
            color: white;
            margin-bottom: 10px;
            font-size: 14px;
        }

        footer p {
            margin: 0;
            font-size: 12px;
            line-height: 1.8;
            max-width: 600px;
        }

        #modal {
            position: relative;
            z-index: 100;
        }
        
        #modal:empty {
            display: none;
        }

        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(9, 31, 43, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: flex-end;
            animation: fadeIn 0.3s ease;
        }

        .drawer {
            background: white;
            width: 100%;
            max-width: 640px;
            height: 100%;
            padding: 50px 40px;
            overflow-y: auto;
            position: relative;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: -10px 0 40px rgba(0,0,0,0.1);
            /* Mobile interaction fix: ensure pointer-events are auto */
            pointer-events: auto;
        }

        .drawer .x {
            position: absolute;
            top: 25px;
            right: 25px;
            background: #f1efea;
            border: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--navy);
            z-index: 2; /* Make sure it's clickable */
        }
        
        .drawer .x:hover {
            background: var(--line);
        }

        .drawer h2 {
            margin: 10px 0 20px;
            font-size: 26px;
            color: var(--navy);
            line-height: 1.3;
        }

        .drawer .lead {
            font-size: 15px;
            line-height: 1.7;
            color: #4a5c63;
            margin-bottom: 30px;
        }

        .drawer h4 {
            font-size: 14px;
            color: var(--navy);
            margin: 30px 0 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--line);
        }

        .drawer p {
            font-size: 13px;
            line-height: 1.7;
            color: var(--muted);
            margin: 0;
        }

        .drawer p.pre {
            white-space: pre-wrap;
        }

        .drawer p.risk {
            color: #a84b25;
            background: #fcf4f1;
            padding: 12px;
            border-radius: 4px;
        }
        
        .drawer p.note {
            font-size: 11px;
            margin-top: 30px;
            border-top: 1px dashed var(--line);
            padding-top: 15px;
            text-align: center;
        }

        .drawer dl {
            margin: 0;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .drawer dl div {
            background: var(--ivory);
            padding: 12px 15px;
            border-radius: 4px;
        }

        .drawer dt {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .drawer dd {
            margin: 0;
            font-size: 13px;
            color: var(--navy);
            line-height: 1.5;
        }

        .official {
            margin-top: 40px;
            padding: 25px;
            background: #f4f8f7;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .official b {
            display: block;
            color: var(--navy);
            font-size: 14px;
            margin-bottom: 4px;
        }

        .official small {
            color: var(--muted);
            font-size: 12px;
            display: block;
        }

        .official a {
            background: var(--orange);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            white-space: nowrap;
            text-align: center;
        }
        
        .official a:hover {
            background: #b84b1a;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        @media (max-width: 1024px) {
            .hero {
                grid-template-columns: 1fr;
                gap: 40px;
                padding-bottom: 120px;
            }
            .hero-card {
                max-width: 500px;
            }
            .path > div {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .journeys > div {
                grid-template-columns: 1fr;
            }
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
            .filters .search {
                width: 100%;
            }
            .official {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .grid {
                grid-template-columns: 1fr; /* Single column on mobile */
            }
        }
        
        @media (max-width: 480px) {
            .path > div {
                grid-template-columns: 1fr;
            }
            nav {
                display: none; /* Hide nav on very small screens for simplicity */
            }
            .drawer {
                padding: 30px 20px;
            }
        }
        
        /* Mobile specific fix for buttons */
        @media (hover: none) {
            .product button:active {
                background: var(--navy);
                color: white;
            }
            .drawer .x:active {
                background: var(--line);
            }
        }
    </style>
</head>

            document.querySelector("#count").innerHTML = `当前显示 <b>${a.length}</b> 项；所有产品名称及参数均来自最新版汇总表。`;
            
            cards.innerHTML = a.length 
                ? a.slice(0, s.limit).map(card).join("") 
                : `<div class="empty">没有找到符合条件的产品，请调整筛选条件。</div>`;
                
            const more = document.querySelector("#more");
            more.hidden = a.length <= s.limit;
            more.textContent = `加载更多（还有 ${Math.max(0, a.length - s.limit)} 项）`;
        }

        // Expose openModal globally so inline onclick handlers on articles can reach it
        window.openModal = function(id) {
            const p = P.find(x => x.id === id);
            if (!p) return;
            
            s.selected = p;
            
            // Try updating URL safely, avoid errors if in restricted iframe
            try {
                history.replaceState(null, "", `?product=${encodeURIComponent(id)}`);
            } catch(e) { console.log("History API blocked", e) }
            
            document.body.style.overflow = "hidden"; // Prevent background scroll
            
            document.querySelector("#modal").innerHTML = `
                <div class="backdrop" id="modal-backdrop">
                    <article class="drawer" id="modal-drawer">
                        <button class="x" aria-label="关闭" type="button" id="modal-close">×</button>
                        ${tags(p)}
                        <small>${esc(p.id)} · ${esc(p.category)}</small>
                        <h2>${esc(p.name)}</h2>
                        <p class="lead">${esc(p.summary)}</p>
                        
                        <h4>适合客户</h4>
                        <p>${nl(p.audience)}</p>
                        
                        <h4>客户场景</h4>
                        <p>${nl(p.scenario)}</p>
                        
                        ${p.details?.length ? `<h4>资格与参数</h4><dl>${p.details.map(d => `<div><dt>${esc(d.label)}</dt><dd>${nl(d.value)}</dd></div>`).join("")}</dl>` : ""}
                        ${p.advantages ? `<h4>核心优势</h4><p class="pre">${nl(p.advantages)}</p>` : ""}
                        ${p.process ? `<h4>办理流程／所需资料</h4><p class="pre">${nl(p.process)}</p>` : ""}
                        ${p.risk ? `<h4>主要风险及提示</h4><p class="risk">${nl(p.risk)}</p>` : ""}
                        
                        <section class="official">
                            <div>
                                <b>官方查询与办理入口</b>
                                <small>${p.officialSpecific ? "此链接为正式服务资料。" : "现有汇总表未提供独立产品链接，以下为所属机构官网。"}</small>
                            </div>
                            <a href="${esc(p.officialUrl)}" target="_blank" rel="noreferrer">前往官网 ↗</a>
                        </section>
                        
                        ${p.note ? `<p class="note">${nl(p.note)}</p>` : ""}
                    </article>
                </div>
            `;
            
            // Setup robust closing mechanisms for mobile
            const bg = document.getElementById("modal-backdrop");
            const closeBtn = document.getElementById("modal-close");
            const drawer = document.getElementById("modal-drawer");
            
            closeBtn.addEventListener('click', closeModal);
            // Touch specific listener to ensure it fires reliably on mobile
            closeBtn.addEventListener('touchend', function(e) {
                e.preventDefault(); // Prevent ghost clicks
                closeModal();
            });

            bg.addEventListener('click', function(e) {
                if (e.target === bg) closeModal();
            });
            
            // Prevent clicks inside drawer from closing the modal
            drawer.addEventListener('click', function(e) {
                e.stopPropagation();
            });
            drawer.addEventListener('touchend', function(e) {
                e.stopPropagation();
            });
        };

        function closeModal() {
            s.selected = null;
            try {
                history.replaceState(null, "", location.pathname);
            } catch(e){}
            document.body.style.overflow = ""; // Restore scroll
            document.querySelector("#modal").innerHTML = "";
        }

        function bind() {
            document.querySelector("#search").oninput = e => { s.q = e.target.value; s.limit = 18; render(); };
            document.querySelector("#provider").onchange = e => { s.provider = e.target.value; s.limit = 18; render(); };
            document.querySelector("#journey").onchange = e => { s.journey = e.target.value; s.limit = 18; render(); };
            document.querySelector("#core").onchange = e => { s.core = e.target.checked; s.limit = 18; render(); };
            document.querySelector("#more").onclick = () => { s.limit += 18; render(); };
            
            document.querySelectorAll("[data-journey]").forEach(b => {
                b.onclick = () => {
                    s.journey = b.dataset.journey;
                    document.querySelector("#journey").value = s.journey;
                    s.limit = 18;
                    render();
                    document.querySelector("#products").scrollIntoView({ behavior: "smooth" });
                };
            });
            
            document.onkeydown = e => {
                if (e.key === "Escape") closeModal();
            };
        }

        // Initialize App
        shell();
        
        // Handle deep linking based on URL parameter
        try {
            const deep = new URLSearchParams(location.search).get("product");
            if (deep) window.openModal(deep);
        } catch(e){}
        
    </script>
</body>
</html>
